name: Deploy Production

# ONE ordered production pipeline for the whole monorepo, per REGION. MANUAL
# (workflow_dispatch) with a required `region` input (us | uk | au). One run
# deploys exactly ONE region's ordered chain:
#
#   bf-check -> bf-deploy -> fm-check -> fm-deploy -> pgw-check -> pgw-deploy
#
# Controlled rollout = run once per region (us, verify, then uk, then au). Each
# region is a SEPARATE set of worker scripts (bot-fleet-<r>-production etc), so
# regions are fully isolated; there are NO cross-region bindings.
#
# Jobs are chained with `needs`, so order is strict and it FAILS FAST — this kills
# the in-region cross-Worker service-binding cascade (pgw's FLEET_MANAGER binding
# can't resolve until fleet-manager-<r>-production exists; fleet-manager's
# BOT_FLEET binding can't resolve until bot-fleet-<r>-production exists).
#
# Dependency order (a service binding requires its target Worker to already EXIST):
#   fleet-manager -> bot-fleet   (BOT_FLEET -> bot-fleet-<r>-production)
#   platform-gw   -> fleet-manager (FLEET_MANAGER -> fleet-manager-<r>-production)
#   bot-fleet     -> platform-gw  (GATEWAY -> platform-gateway-<r>-production) [steady-state only]
#
# REGION -> Worker placement (set in wrangler.jsonc, not here):
#   us -> aws:us-east-1 | uk -> aws:eu-west-2 | au -> aws:ap-southeast-2
#
# SECRETS: only the *-deploy jobs need CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID,
# read from the `production` GitHub Environment (attach required-reviewer
# protection there). The *-check jobs need NO secrets.
#
# RESOURCE IDS: D1 / Hyperdrive / Secrets Store are per-region. The deploy jobs
# RESOLVE their ids by name and pin the PROD_<r>_* placeholder tokens (resolve-only;
# fails if missing — CI never creates). Provision them first under the names below.

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region to deploy
        required: true
        type: choice
        options:
          - us
          - uk
          - au

permissions:
  contents: read

jobs:
  # 1) bot-fleet CHECK ---------------------------------------------------------
  bf-check:
    name: bf check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint apps/bot-fleet packages/shared --max-warnings=0
      - name: Test
        run: pnpm --filter bot-fleet test
      - name: Typecheck
        run: pnpm --filter "@tutorbot/shared" --filter bot-fleet typecheck
      # Dry-run bundles + validates config for the target region (+ default/staging).
      - name: Validate wrangler config (default)
        run: pnpm --filter bot-fleet exec wrangler deploy --dry-run
      - name: Validate wrangler config (staging)
        run: pnpm --filter bot-fleet exec wrangler deploy --dry-run --env staging
      - name: Validate wrangler config (${{ inputs.region }}-production)
        run: pnpm --filter bot-fleet exec wrangler deploy --dry-run --env ${{ inputs.region }}-production

  # 2) bot-fleet DEPLOY --------------------------------------------------------
  bf-deploy:
    name: bf ${{ inputs.region }} deploy
    needs: bf-check
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter "@tutorbot/shared" build
      # Registers the BotFleetDO namespace + uploads the worker as
      # bot-fleet-<r>-production. No fetch/cron on deploy => ZERO DO instances.
      - name: Pin ${{ inputs.region }} Hyperdrive id (resolve-only)
        uses: ./.github/actions/pin-resource-id
        with:
          api-path: hyperdrive/configs
          id-field: id
          resource-name: tutorbot-supabase-${{ inputs.region }}-production
          placeholder: PROD_${{ inputs.region }}_HYPERDRIVE_ID
          working-directory: apps/bot-fleet
      - name: Deploy bot-fleet (${{ inputs.region }}-production)
        working-directory: apps/bot-fleet
        run: pnpm exec wrangler deploy --env ${{ inputs.region }}-production

  # 3) fleet-manager CHECK -----------------------------------------------------
  fm-check:
    name: fm check
    needs: bf-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint apps/fleet-manager packages/shared --max-warnings=0
      - name: Test
        run: pnpm --filter fleet-manager test
      - name: Typecheck
        run: pnpm --filter "@tutorbot/shared" --filter fleet-manager typecheck
      # The D1 / Hyperdrive placeholder tokens in the env blocks are tolerated by
      # dry-run.
      - name: Validate wrangler config (default)
        run: pnpm --filter fleet-manager exec wrangler deploy --dry-run
      - name: Validate wrangler config (staging)
        run: pnpm --filter fleet-manager exec wrangler deploy --dry-run --env staging
      - name: Validate wrangler config (${{ inputs.region }}-production)
        run: pnpm --filter fleet-manager exec wrangler deploy --dry-run --env ${{ inputs.region }}-production

  # 4) fleet-manager DEPLOY ----------------------------------------------------
  fm-deploy:
    name: fm ${{ inputs.region }} deploy
    needs: fm-check
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter "@tutorbot/shared" build
      # Resolve-only: look up D1 + Hyperdrive by name and pin their ids into the
      # <r>-production env block (ephemeral, not committed). Fails loudly if missing.
      - name: Pin ${{ inputs.region }} D1 id (resolve-only)
        uses: ./.github/actions/pin-resource-id
        with:
          api-path: d1/database
          id-field: uuid
          resource-name: tutorbot-fleet-registry-${{ inputs.region }}-production
          placeholder: PROD_${{ inputs.region }}_D1_ID
          working-directory: apps/fleet-manager
      - name: Pin ${{ inputs.region }} Hyperdrive id (resolve-only)
        uses: ./.github/actions/pin-resource-id
        with:
          api-path: hyperdrive/configs
          id-field: id
          resource-name: tutorbot-supabase-${{ inputs.region }}-production
          placeholder: PROD_${{ inputs.region }}_HYPERDRIVE_ID
          working-directory: apps/fleet-manager
      - name: Apply D1 migrations (${{ inputs.region }}-production, remote)
        working-directory: apps/fleet-manager
        run: pnpm exec wrangler d1 migrations apply tutorbot-fleet-registry-${{ inputs.region }}-production --env ${{ inputs.region }}-production --remote
      - name: Deploy fleet-manager (${{ inputs.region }}-production)
        working-directory: apps/fleet-manager
        run: pnpm exec wrangler deploy --env ${{ inputs.region }}-production

  # 5) platform-gateway CHECK --------------------------------------------------
  pgw-check:
    name: pgw check
    needs: fm-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint apps/platform-gateway packages/shared --max-warnings=0
      - name: Test
        run: pnpm --filter "@tutorbot/platform-gateway-worker" --filter "@tutorbot/platform-gateway-container" test
      - name: Typecheck
        run: pnpm --filter "@tutorbot/shared" --filter "@tutorbot/platform-gateway-worker" --filter "@tutorbot/platform-gateway-container" typecheck
      - name: Build shared package
        run: pnpm --filter "@tutorbot/shared" build
      - name: Build container package
        run: pnpm --filter "@tutorbot/platform-gateway-container" build
      # `validate:config` runs `wrangler types` for default + staging + all three
      # <r>-production envs.
      - name: Validate Wrangler config
        run: pnpm --filter "@tutorbot/platform-gateway-worker" validate:config

  # 6) platform-gateway DEPLOY -------------------------------------------------
  pgw-deploy:
    name: pgw ${{ inputs.region }} deploy
    needs: pgw-check
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter "@tutorbot/shared" build
      # Deploys worker platform-gateway-<r>-production + builds/pushes the container
      # image and rolls it out gradually. Its FLEET_MANAGER service binding resolves
      # because fm-deploy (job 4) ran first for this region.
      - name: Pin ${{ inputs.region }} Secrets Store id (resolve-only)
        uses: ./.github/actions/pin-resource-id
        with:
          api-path: secrets_store/stores
          id-field: id
          resource-name: tutorbot-bots-${{ inputs.region }}-production
          placeholder: PROD_${{ inputs.region }}_SECRETS_STORE_ID
          working-directory: apps/platform-gateway/worker
      - name: Deploy gateway (${{ inputs.region }}-production)
        run: pnpm --filter "@tutorbot/platform-gateway-worker" exec wrangler deploy --env ${{ inputs.region }}-production --containers-rollout=gradual

# COLD ENVIRONMENT NOTE ------------------------------------------------------
# On a brand-new region the in-region service-binding graph has a cycle
# (bf -> pgw -> fm -> bf), so no strict order satisfies every binding on the FIRST
# deploy. This chain assumes a bootstrapped region (targets already exist). For a
# cold bootstrap, run once with the cross-service bindings temporarily removed (or
# deploy stubs), then re-run this pipeline for that region.
